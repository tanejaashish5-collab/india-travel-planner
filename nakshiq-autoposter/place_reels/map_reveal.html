<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{NAME}}: where it really is</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Generated by nakshiq-autoposter/place_reels.py (map_reveal) from reel-data.json ({{SNAPSHOT}}).
         People-free format (founder 2026-10-15). Scores on the site's 0-10 scale. Do not hand-edit. */
      :root { --bg: #100d0a; --fg: #f6efe4; --soft: #e3d8c7; --accent: #ffb23e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--fg); background: var(--bg); }
      .display { font-family: "League Gothic", sans-serif; text-transform: uppercase; line-height: .9; letter-spacing: .01em; }
      #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
      #scrim { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, rgba(16,13,10,.5) 0%, rgba(16,13,10,.15) 35%, rgba(16,13,10,.55) 60%, rgba(16,13,10,.94) 100%); }
      #mapwrap { position: absolute; left: 40px; top: 470px; width: 1000px; height: 1100px; }
      #mapwrap svg { width: 1000px; height: 1100px; overflow: visible; }
      #mapwrap path { fill: rgba(246,239,228,.07) !important; stroke: rgba(246,239,228,.85) !important; stroke-width: 1.6 !important; }
      #q { position: absolute; left: 80px; right: 80px; top: 210px; font-size: 74px; font-weight: 800; line-height: 1.08; }
      #q em { font-style: normal; color: var(--accent); }
      .card { position: absolute; left: 50px; right: 50px; background: rgba(16,13,10,.86); border-radius: 28px; }
      #s2 .name { position: absolute; left: 84px; top: 1010px; font-size: {{NAME_PX}}px; }
      #s2 .state { position: absolute; left: 88px; top: 940px; font-size: 44px; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
      #s2 .facts { position: absolute; left: 88px; top: {{FACTS_TOP}}px; width: 900px; font-size: 52px; font-weight: 700; line-height: 1.2; }
      #s2 .facts div + div { margin-top: 20px; }
      #s2 .facts em { font-style: normal; color: var(--accent); }
      #s3 .kicker { position: absolute; left: 84px; top: 520px; font-size: 44px; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
      #s3 .month { position: absolute; left: 76px; top: 620px; font-size: {{MONTH_PX}}px; }
      #s3 .score { position: absolute; left: 84px; top: 1000px; font-size: 64px; font-weight: 800; }
      #s3 .score em { font-style: normal; color: var(--accent); }
      #s4 .end { position: absolute; left: 84px; right: 84px; top: 1140px; padding: 40px 44px; background: var(--accent); color: #1c1305; border-radius: 26px; }
      #s4 .end .a { font-size: 46px; font-weight: 800; }
      #s4 .end .b { font-size: 70px; font-weight: 800; margin-top: 6px; }
      #credit { position: absolute; left: 44px; bottom: 60px; font-size: 24px; color: rgba(246,239,228,.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <!-- Music: {{MUSIC}} (Mixkit), trimmed and faded with ffmpeg -->
      <audio id="bgm" class="clip" src="assets/music.m4a" data-start="0" data-duration="{{DUR}}" data-track-index="2"></audio>
      <img id="photo" src="assets/photo.jpg" alt="" />
      <div id="scrim"></div>

      <div id="mapwrap">
        <svg viewBox="0 0 1000 1100" xmlns="http://www.w3.org/2000/svg">
          {{MAP_PATH}}
          <circle id="ring" cx="{{PX}}" cy="{{PY}}" r="10" fill="none" stroke="#ffb23e" stroke-width="3" />
          <circle id="pin" cx="{{PX}}" cy="{{PY}}" r="9" fill="#ffb23e" />
        </svg>
      </div>
      <div id="q">Where is <em>{{NAME}}</em>, really?</div>

      <section id="s2" class="scene clip" data-start="4.2" data-duration="5.8" data-track-index="1">
        <div class="card" id="s2-card" style="top:900px;height:{{CARD_H}}px"></div>
        <div class="state" id="s2-state">{{STATE}}</div>
        <div class="name display" id="s2-name">{{NAME}}</div>
        <div class="facts" id="s2-facts">
{{FACTS}}
        </div>
      </section>

      <section id="s3" class="scene clip" data-start="10" data-duration="2.6" data-track-index="1">
        <div class="card" id="s3-card" style="top:470px;height:680px"></div>
        <div class="kicker" id="s3-kicker">The next good window</div>
        <div class="month display" id="s3-month">{{BEST}}</div>
        <div class="score" id="s3-score">NakshIQ score <em>{{BEST_SCORE}}/10</em></div>
      </section>

      <section id="s4" class="scene clip" data-start="12.6" data-duration="{{END_DUR}}" data-track-index="1">
        <div class="end" id="s4-end"><div class="a">Every place, every month</div><div class="b">nakshiq.com</div><div class="a" style="margin-top:10px;font-size:38px">{{FOLLOW}}</div></div>
      </section>
      <div id="credit">{{CREDIT}}</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      // 1 the map, the pin, the zoom
      tl.fromTo("#q", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0.1);
      tl.fromTo("#mapwrap", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.2);
      tl.fromTo("#pin", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.1);
      tl.fromTo("#ring", { scale: 1, opacity: 1, transformOrigin: "50% 50%" }, { scale: 5, opacity: 0, duration: 0.9, repeat: 2 }, 1.3);
      tl.to("#mapwrap", { x: {{TX}}, y: {{TY}}, scale: {{ZOOM}}, transformOrigin: "{{PX}}px {{PY}}px", duration: 1.9, ease: "power2.inOut" }, 2.1);
      // 2 the place itself, then the facts
      tl.to("#q", { opacity: 0, duration: 0.3 }, 3.7);
      tl.to("#photo", { opacity: 1, duration: 0.7 }, 3.8);
      tl.to("#scrim", { opacity: 1, duration: 0.7 }, 3.8);
      tl.to("#mapwrap", { opacity: 0, duration: 0.5 }, 4.0);
      tl.fromTo("#photo", { scale: 1.0 }, { scale: 1.12, duration: 11.2, ease: "none" }, 3.8);
      tl.fromTo("#s2-card", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.3);
      tl.fromTo("#s2-state", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: E }, 4.4);
      tl.fromTo("#s2-name", { opacity: 0, yPercent: 30 }, { opacity: 1, yPercent: 0, duration: 0.5, ease: "expo.out" }, 4.55);
      tl.fromTo("#s2-facts div", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.9, ease: E }, 5.3);
      tl.to(["#s2-card", "#s2-state", "#s2-name", "#s2-facts"], { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 9.7);
      // 3 when to go
      tl.fromTo("#s3-card", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10.0);
      tl.fromTo("#s3-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: E }, 10.1);
      tl.fromTo("#s3-month", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out", transformOrigin: "0% 50%" }, 10.25);
      tl.fromTo("#s3-score", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 10.8);
      tl.to(["#s3-card", "#s3-kicker", "#s3-month", "#s3-score"], { opacity: 0, duration: 0.3 }, 12.3);
      // 4 end
      tl.fromTo("#s4-end", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 12.7);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
