<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{NAME}}, in miniature</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Generated by nakshiq-autoposter/place_reels.py (tiny_world) from reel-data.json ({{SNAPSHOT}}).
         Two Veo clips animated from miniature stills made from the place's own photo. Do not hand-edit. */
      :root { --bg: #100d0a; --fg: #f6efe4; --soft: #e3d8c7; --accent: #ffb23e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--fg); }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,13,10,.6) 0%, rgba(16,13,10,0) 28%, rgba(16,13,10,0) 62%, rgba(16,13,10,.9) 100%); }
      .display { font-family: "League Gothic", sans-serif; text-transform: uppercase; line-height: .9; letter-spacing: .01em; }
      #t1 { position: absolute; left: 80px; top: 170px; }
      #t1 .name { font-size: {{NAME_PX}}px; }
      #t1 .sub { font-size: 56px; font-weight: 800; color: var(--accent); margin-top: 10px; }
      #facts { position: absolute; left: 84px; bottom: 260px; width: 920px; font-size: 54px; font-weight: 800; line-height: 1.2; }
      #facts div + div { margin-top: 18px; }
      #facts em { font-style: normal; color: var(--accent); }
      #end { position: absolute; left: 84px; right: 84px; bottom: 220px; padding: 40px 44px; background: var(--accent); color: #1c1305; border-radius: 26px; opacity: 0; }
      #end .a { font-size: 46px; font-weight: 800; }
      #end .b { font-size: 70px; font-weight: 800; margin-top: 6px; }
      #disc { position: absolute; left: 44px; bottom: 60px; font-size: 24px; color: rgba(246,239,228,.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <video id="v1" class="clip" src="assets/bg1.mp4" data-start="0" data-duration="7.5" data-media-start="0" data-track-index="0" muted playsinline></video>
      <video id="v2" class="clip" src="assets/bg2.mp4" data-start="7.5" data-duration="{{V2_DUR}}" data-media-start="0" data-track-index="0" muted playsinline></video>
      <!-- Music: {{MUSIC}} (Mixkit), trimmed and faded with ffmpeg -->
      <audio id="bgm" class="clip" src="assets/music.m4a" data-start="0" data-duration="{{DUR}}" data-track-index="2"></audio>
      <div class="scrim"></div>
      <div id="t1"><div class="name display">{{NAME}}</div><div class="sub">{{SUB}}</div></div>
      <div id="facts">
{{FACTS}}
      </div>
      <div id="end"><div class="a">Every place, every month</div><div class="b">nakshiq.com</div><div class="a" style="margin-top:10px;font-size:38px">{{FOLLOW}}</div></div>
      <div id="disc">AI miniature of the real place</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      tl.fromTo("#t1 .name", { opacity: 0, yPercent: 30 }, { opacity: 1, yPercent: 0, duration: 0.6, ease: "expo.out" }, 0.2);
      tl.fromTo("#t1 .sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0.8);
      tl.to("#t1", { opacity: 0, y: -30, duration: 0.4 }, 3.4);
      tl.fromTo("#facts div", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, stagger: 1.6, ease: E }, 3.8);
      tl.to("#facts", { opacity: 0, duration: 0.4 }, 11.4);
      tl.fromTo("#end", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 11.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
