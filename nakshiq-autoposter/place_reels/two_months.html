<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{NAME}}: same place, two months</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Generated by nakshiq-autoposter/place_reels.py (two_months) from reel-data.json ({{SNAPSHOT}}).
         Both clips are Veo footage made from the place's own photo, prompted only with what each month's note says.
         Scores on the site's 0-10 scale. Do not hand-edit. */
      :root { --bg: #100d0a; --fg: #f6efe4; --soft: #e3d8c7; --go: #ffb23e; --skip: #ff7a66; --wait: #c7b79c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--fg); background: var(--bg); }
      .display { font-family: "League Gothic", sans-serif; text-transform: uppercase; line-height: .9; letter-spacing: .01em; }
      .half { position: absolute; left: 0; width: 1080px; height: 958px; overflow: hidden; }
      #top { top: 0; }
      #bot { top: 962px; }
      .half video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .half .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,13,10,0) 40%, rgba(16,13,10,.85) 100%); }
      #bot .shade { background: linear-gradient(180deg, rgba(16,13,10,.85) 0%, rgba(16,13,10,0) 60%); }
      .lab { position: absolute; left: 60px; }
      #top .lab { bottom: 50px; }
      #bot .lab { top: 50px; }
      .lab .m { font-size: 190px; }
      .lab .s { font-size: 54px; font-weight: 800; margin-top: 4px; }
      .lab .c { font-size: 42px; font-weight: 700; color: var(--fg); margin-top: 10px; width: 940px; line-height: 1.18; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
      .go { color: var(--go); } .skip { color: var(--skip); } .wait { color: var(--wait); }
      
      #divider { position: absolute; left: 0; top: 958px; width: 1080px; height: 4px; background: var(--fg); transform-origin: 0 50%; }
      #hook { position: absolute; left: 0; right: 0; top: 0; height: 1920px; background: rgba(16,13,10,.72); }
      #hook .name { position: absolute; left: 80px; top: 620px; font-size: {{NAME_PX}}px; }
      #hook .line { position: absolute; left: 84px; top: {{LINE_TOP}}px; width: 900px; font-size: 66px; font-weight: 800; line-height: 1.1; }
      #hook .line em { font-style: normal; color: var(--go); }
      #end { position: absolute; inset: 0; background: rgba(16,13,10,.93); opacity: 0; }
      #end .t { position: absolute; left: 84px; right: 84px; top: 560px; font-size: 92px; font-weight: 800; line-height: 1.12; }
      #end .t em { font-style: normal; color: var(--go); }
      #end .box { position: absolute; left: 84px; right: 84px; top: 1140px; padding: 40px 44px; background: var(--go); color: #1c1305; border-radius: 26px; }
      #end .box .a { font-size: 46px; font-weight: 800; }
      #end .box .b { font-size: 70px; font-weight: 800; margin-top: 6px; }
      #credit { position: absolute; left: 44px; bottom: 34px; font-size: 22px; color: rgba(246,239,228,.65); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <!-- Music: {{MUSIC}} (Mixkit), trimmed and faded with ffmpeg -->
      <audio id="bgm" class="clip" src="assets/music.m4a" data-start="0" data-duration="{{DUR}}" data-track-index="2"></audio>
      <!-- the skip month's own sound (rain, wind) from its Veo clip, under the music once its label is up -->
      <audio id="amb" class="clip" src="assets/amb.m4a" data-start="4.4" data-duration="5.6" data-media-start="0" data-track-index="4"></audio>
      <div class="half" id="top"><video id="vA" class="clip" src="assets/v1.mp4" data-start="0" data-duration="10" data-media-start="0" data-track-index="0" muted playsinline></video><div class="shade"></div>
        <div class="lab" id="labA"><div class="m display">{{A_MONTH}}</div><div class="s {{A_CLASS}}">{{A_SCORE}}/10 · {{A_VERDICT}}</div><div class="c">{{A_NOTE}}</div></div></div>
      <div class="half" id="bot"><video id="vB" class="clip" src="assets/v2.mp4" data-start="0" data-duration="10" data-media-start="0" data-track-index="3" muted playsinline></video><div class="shade"></div>
        <div class="lab" id="labB"><div class="m display">{{B_MONTH}}</div><div class="s {{B_CLASS}}">{{B_SCORE}}/10 · {{B_VERDICT}}</div><div class="c">{{B_NOTE}}</div></div></div>
      <div id="divider"></div>
      <div id="hook"><div class="name display">{{NAME}}</div><div class="line" id="hookline">{{HOOK}}</div></div>
      <div id="end"><div class="t" id="endt">{{END_LINE}}</div>
        <div class="box"><div class="a">Every place, every month</div><div class="b">nakshiq.com</div><div class="a" style="margin-top:10px;font-size:38px">{{FOLLOW}}</div></div></div>
      <div id="credit">{{CREDIT}}</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      // 1 hook over both pictures
      tl.fromTo("#hook .name", { opacity: 0, yPercent: 30 }, { opacity: 1, yPercent: 0, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.fromTo("#hookline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0.6);
      tl.to("#hook", { opacity: 0, duration: 0.4 }, 2.8);
      // 2 the good month, then the other one
      tl.fromTo("#divider", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: E }, 2.6);
      tl.fromTo("#labA", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 2.9);
      tl.fromTo("#labA .c", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.5);
      tl.fromTo("#labB", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 4.6);
      tl.fromTo("#labB .c", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.2);
      // 3 end
      tl.to("#end", { opacity: 1, duration: 0.5 }, 10.0);
      tl.fromTo("#endt", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 10.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
