<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{NAME}}: voiced place reel</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Generated by nakshiq-autoposter/place_voiced.py (founder 2026-10-20: ~40 s, Hindi voice, more
         information, upbeat music). People-free. Scenes start as their voice line starts. Do not hand-edit. */
      :root { --bg: #161614; --fg: #F5F1E8; --soft: #B8B2A3; --accent: #E55642; }   /* brand: Ink Deep, Bone, Vermillion Bright (founder 2026-10-20: no yellow) */
      @font-face { font-family: "Crimson Pro"; src: url("assets/CrimsonPro-Italic.ttf"); font-style: italic; font-weight: 400; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/InstrumentSans-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/InstrumentSans-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--fg); background: var(--bg); }
      .display { font-family: "League Gothic", sans-serif; text-transform: uppercase; line-height: .9; letter-spacing: .01em; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #scrim { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, rgba(16,13,10,.35) 0%, rgba(16,13,10,.05) 30%, rgba(16,13,10,.45) 55%, rgba(16,13,10,.92) 100%); }
      #mapwrap { position: absolute; left: 40px; top: 470px; width: 1000px; height: 1100px; }
      #mapwrap svg { width: 1000px; height: 1100px; overflow: visible; }
      #mapwrap path { fill: rgba(246,239,228,.07) !important; stroke: rgba(246,239,228,.85) !important; stroke-width: 1.6 !important; }
      #q { position: absolute; left: 80px; right: 80px; top: 210px; font-size: 78px; font-weight: 800; line-height: 1.08; }
      #q em, .card em { font-style: normal; color: var(--accent); }
      .card { position: absolute; left: 50px; right: 50px; bottom: 230px; padding: 46px 44px 50px; background: rgba(14,14,12,.88); border: 2px solid rgba(245,241,232,.14); border-radius: 30px; }   /* option B, the Ink card */
      .card .kick::after { content: ""; display: block; width: 110px; height: 4px; background: var(--accent); margin-top: 16px; }
      .kick { font-size: 42px; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
      .big { margin-top: 14px; }
      .line { margin-top: 18px; font-size: 60px; font-weight: 800; }
      .sub { margin-top: 18px; font-size: 46px; font-weight: 600; color: var(--soft); line-height: 1.25; }
      .facts { margin-top: 22px; font-size: 52px; font-weight: 700; line-height: 1.2; }
      .facts div + div { margin-top: 18px; }
      .rows { margin-top: 26px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 56px; font-weight: 700; padding: 14px 0; border-top: 2px solid rgba(246,239,228,.18); }
      .row b { font-size: 92px; font-weight: 800; color: var(--accent); }
      /* option C, the full Ink end screen: the same signature close on every reel */
      #end { position: absolute; inset: 0; background: #161614; opacity: 0; text-align: center; color: var(--fg); }
      #end .wm { position: absolute; left: 0; right: 0; top: 780px; font-family: "Crimson Pro", serif; font-style: italic; font-size: 210px; line-height: 1; letter-spacing: -.01em; }
      #end .wm span { color: var(--accent); }
      #end .tag { position: absolute; left: 0; right: 0; top: 1030px; font: 400 26px "Instrument Sans", sans-serif; letter-spacing: .32em; text-transform: uppercase; color: var(--soft); }
      #end .url { position: absolute; left: 0; right: 0; top: 1190px; font: 700 66px "Instrument Sans", sans-serif; }
      #end .sub2 { position: absolute; left: 0; right: 0; top: 1280px; font: 400 42px "Instrument Sans", sans-serif; color: var(--soft); }
      #end .btn { position: absolute; left: 50%; top: 1400px; transform: translateX(-50%); font: 700 40px "Instrument Sans", sans-serif; padding: 18px 40px; border: 3px solid var(--accent); border-radius: 999px; white-space: nowrap; }
      .sub-line { z-index: 4; position: absolute; left: 60px; right: 60px; top: 430px; text-align: center; font-size: 64px; font-weight: 800; line-height: 1.15;
                  color: #fff; text-shadow: 0 0 6px rgba(0,0,0,.95), 0 4px 18px rgba(0,0,0,.85); -webkit-text-stroke: 2px rgba(0,0,0,.55); paint-order: stroke fill; }
      .sub-line em { font-style: normal; color: var(--accent); }
      #credit { position: absolute; left: 44px; bottom: 60px; right: 44px; font-size: 24px; color: rgba(246,239,228,.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <!-- Sound: Hindi voice (ElevenLabs) over {{MUSIC}} (Mixkit), ducked and mixed with ffmpeg -->
      <audio id="mix" class="clip" src="assets/mix.m4a" data-start="0" data-duration="{{DUR}}" data-track-index="2"></audio>
      {{MEDIA}}
      <div id="scrim"></div>
      <div id="mapwrap">
        <svg viewBox="0 0 1000 1100" xmlns="http://www.w3.org/2000/svg">
          {{MAP_PATH}}
          <circle id="ring" cx="{{PX}}" cy="{{PY}}" r="10" fill="none" stroke="#E55642" stroke-width="3" />
          <circle id="pin" cx="{{PX}}" cy="{{PY}}" r="9" fill="#E55642" />
        </svg>
      </div>
      <div id="q">{{HOOK}}</div>
      {{SCENES}}
      {{SUBS}}
      <div id="end"><div class="wm">Naksh<span>.</span>iq</div><div class="tag">Travel with IQ</div><div class="url">nakshiq.com</div><div class="sub2">Every place, every month</div><div class="btn">Follow NakshIQ</div></div>
      <div id="credit" style="z-index:3">{{CREDIT}}</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      // the map, the pin, the zoom: under the hook line
      tl.fromTo("#q", { opacity: 1, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0);   // on frame 0: feeds that take the first frame show the hook
      tl.fromTo("#mapwrap", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.2);
      tl.fromTo("#pin", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.0);
      tl.fromTo("#ring", { scale: 1, opacity: 1, transformOrigin: "50% 50%" }, { scale: 5, opacity: 0, duration: 0.9, repeat: 3 }, 1.2);
      tl.to("#mapwrap", { x: {{TX}}, y: {{TY}}, scale: 3.2, transformOrigin: "{{PX}}px {{PY}}px", duration: 2.4, ease: "power2.inOut" }, 2.4);
      tl.to(["#q", "#mapwrap"], { opacity: 0, duration: 0.35 }, {{MAP_END}} - 0.2);
      tl.to("#scrim", { opacity: 1, duration: 0.5 }, {{MAP_END}} - 0.2);
      {{ANIM}}
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, {{END_START}} + 0.1);
      tl.to("#credit", { opacity: 0, duration: 0.3 }, {{END_START}} + 0.1);
      tl.fromTo(["#end .wm", "#end .tag", "#end .url", "#end .sub2", "#end .btn"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.18, ease: E }, {{END_START}} + 0.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
