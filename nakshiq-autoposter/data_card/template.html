<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{NAME}}: pick the month first</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Generated by nakshiq-autoposter/data_card.py from reel-data.json ({{SNAPSHOT}}).
         Scores on the site's 0-10 scale (DB x2). Do not hand-edit a generated copy. */
      :root {
        --bg: #100d0a;
        --fg: #f6efe4;
        --soft: #e3d8c7;
        --accent: #ffb23e;
        --skip: #ff7a66;
        --wait: #c7b79c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--fg); }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,13,10,.55) 0%, rgba(16,13,10,.2) 30%, rgba(16,13,10,.35) 55%, rgba(16,13,10,.92) 100%); }
      .scene { position: absolute; inset: 0; }
      .card { position: absolute; left: 50px; right: 50px; background: rgba(16,13,10,.86); border-radius: 28px; }
      .display { font-family: "League Gothic", sans-serif; text-transform: uppercase; line-height: .9; letter-spacing: .01em; }

      /* 1 hook */
      #s1 .name { position: absolute; left: 80px; top: 300px; font-size: 330px; color: var(--fg); }
      #s1 .line { position: absolute; left: 84px; top: 640px; width: 900px; font-size: 64px; font-weight: 700; line-height: 1.12; }
      #s1 .line b { color: var(--skip); white-space: nowrap; }

      /* 2 chart */
      #s2 .panel { position: absolute; left: 60px; right: 60px; top: 330px; height: 1080px; background: rgba(16,13,10,.82); border-radius: 28px; padding: 56px 48px 40px; }
      #s2 .title { font-size: 50px; font-weight: 700; }
      #s2 .sub { font-size: 34px; color: var(--soft); margin-top: 10px; }
      #s2 .bars { position: absolute; left: 48px; right: 48px; bottom: 110px; height: 640px; display: flex; align-items: flex-end; gap: 14px; }
      #s2 .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
      #s2 .val { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
      #s2 .bar { width: 100%; border-radius: 10px 10px 4px 4px; transform-origin: 50% 100%; }
      #s2 .go { background: var(--accent); }
      #s2 .wait { background: var(--wait); }
      #s2 .skip { background: var(--skip); }
      #s2 .months { position: absolute; left: 48px; right: 48px; bottom: 52px; display: flex; gap: 14px; }
      #s2 .months span { flex: 1; text-align: center; font-size: 32px; font-weight: 700; color: var(--soft); }
      #s2 .tag { position: absolute; left: 502px; top: 610px; width: 100px; font-size: 44px; font-weight: 800; color: var(--skip); text-align: center; }

      /* 3 sweet spot */
      #s3 .kicker { position: absolute; left: 84px; top: 370px; font-size: 44px; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
      #s3 .month { position: absolute; left: 76px; top: 480px; font-size: 360px; }
      #s3 .facts { position: absolute; left: 84px; top: 860px; width: 920px; font-size: 56px; font-weight: 700; line-height: 1.2; }
      #s3 .facts div + div { margin-top: 18px; }
      #s3 .facts em { font-style: normal; color: var(--accent); }

      /* 4 cost + end */
      #s4 .kicker { position: absolute; left: 84px; top: 380px; font-size: 44px; font-weight: 700; color: var(--soft); letter-spacing: .06em; text-transform: uppercase; }
      #s4 .row { position: absolute; left: 84px; width: 920px; display: flex; align-items: baseline; justify-content: space-between; }
      #s4 .r1 { top: 470px; }
      #s4 .r2 { top: 660px; }
      #s4 .row span { font-size: 46px; font-weight: 700; color: var(--soft); }
      #s4 .row strong { font-family: "League Gothic", sans-serif; font-size: 190px; font-weight: 400; line-height: 1; }
      #s4 .r2 strong { color: var(--accent); }
      #s4 .note { position: absolute; left: 84px; top: 880px; width: 900px; font-size: 40px; font-weight: 600; color: var(--soft); }
      #s4 .end { position: absolute; left: 84px; right: 84px; top: 1140px; padding: 40px 44px; background: var(--accent); color: #1c1305; border-radius: 26px; }
      #s4 .end .a { font-size: 46px; font-weight: 800; }
      #s4 .end .b { font-size: 70px; font-weight: 800; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <video id="v1" class="clip" src="assets/bg1.mp4" data-start="0" data-duration="5" data-media-start="0" data-track-index="0" muted playsinline></video>
      <video id="v2" class="clip" src="assets/bg2.mp4" data-start="5" data-duration="5" data-media-start="0" data-track-index="0" muted playsinline></video>
      <video id="v3" class="clip" src="assets/bg3.mp4" data-start="10" data-duration="5" data-media-start="0" data-track-index="0" muted playsinline></video>
      <!-- Music: {{MUSIC}} (Mixkit), trimmed and faded with ffmpeg -->
      <audio id="bgm" class="clip" src="assets/music.m4a" data-start="0" data-duration="15" data-track-index="2"></audio>
      <div class="scrim"></div>

      <section id="s1" class="scene clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="card" id="s1-card" style="top:270px;height:620px"></div>
        <div class="name display" id="s1-name" style="font-size:{{NAME_PX}}px">{{NAME}}</div>
        <div class="line" id="s1-line" style="top:{{LINE_TOP}}px">{{HOOK}}</div>
      </section>

      <section id="s2" class="scene clip" data-start="3" data-duration="5.5" data-track-index="1">
        <div class="panel" id="s2-panel">
          <div class="title">{{CHART_TITLE}}</div>
          <div class="sub">NakshIQ score out of 10, for every month.</div>
          {{TAGS}}
          <div class="bars" id="s2-bars"></div>
          <div class="months"><span>J</span><span>F</span><span>M</span><span>A</span><span>M</span><span>J</span><span>J</span><span>A</span><span>S</span><span>O</span><span>N</span><span>D</span></div>
        </div>
      </section>

      <section id="s3" class="scene clip" data-start="8.5" data-duration="3.5" data-track-index="1">
        <div class="card" id="s3-card" style="top:320px;height:800px"></div>
        <div class="kicker" id="s3-kicker">The sweet spot</div>
        <div class="month display" id="s3-month">{{BEST}}</div>
        <div class="facts" id="s3-facts">
{{FACTS}}
        </div>
      </section>

      <section id="s4" class="scene clip" data-start="12" data-duration="3" data-track-index="1">
        <div class="card" id="s4-card" style="top:320px;height:680px"></div>
        <div class="kicker" id="s4-kicker">Mid-range hotel, per night</div>
        <div class="row r1" id="s4-r1"><span>Peak season</span><strong>{{PEAK}}</strong></div>
        <div class="row r2" id="s4-r2"><span>Low season</span><strong>{{LOW}}</strong></div>
        <div class="note" id="s4-note">{{NOTE}}</div>
        <div class="end" id="s4-end"><div class="a">Check any month, any place</div><div class="b">nakshiq.com</div><div class="a" style="margin-top:10px;font-size:38px">{{FOLLOW}}</div></div>
      </section>
    </div>
    <script>
      const SCORES = {{SCORES}};
      const LABELS = {{LABELS}};
      const bars = document.getElementById("s2-bars");
      SCORES.forEach((s, i) => {
        const c = document.createElement("div");
        c.className = "col";
        c.innerHTML = `<div class="val" id="val${i}">${s}</div><div class="bar ${LABELS[i]}" id="bar${i}" style="height:${s * 10}%"></div>`;
        bars.appendChild(c);
      });

      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      // 1 hook
      tl.fromTo("#s1-card", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo("#s1-name", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.fromTo("#s1-line", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: E }, 0.6);
      tl.to(["#s1-name", "#s1-line", "#s1-card"], { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 2.7);
      // 2 chart
      tl.fromTo("#s2-panel", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: E }, 3.0);
      SCORES.forEach((s, i) => {
        tl.fromTo(`#bar${i}`, { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: E }, 3.4 + i * 0.09);
        tl.fromTo(`#val${i}`, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 3.75 + i * 0.09);
      });
      tl.to({{DIM}}, { opacity: 0.35, duration: 0.4 }, 5.4);
      tl.fromTo({{SKIPS}}, { scaleX: 1 }, { scaleX: 1.12, duration: 0.25, yoyo: true, repeat: 1 }, 5.5);
      tl.fromTo("#s2 .tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 5.5);
      tl.to("#s2-panel", { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 8.2);
      // 3 sweet spot
      tl.fromTo("#s3-card", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.5);
      tl.fromTo("#s3-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: E }, 8.6);
      tl.fromTo("#s3-month", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out", transformOrigin: "0% 50%" }, 8.75);
      tl.fromTo("#s3-facts div", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.35, ease: E }, 9.3);
      tl.to(["#s3-kicker", "#s3-month", "#s3-facts", "#s3-card"], { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 11.7);
      // 4 cost + end
      tl.fromTo("#s4-card", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12);
      tl.fromTo("#s4-kicker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.05);
      tl.fromTo("#s4-r1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 12.15);
      tl.fromTo("#s4-r2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 12.45);
      tl.fromTo("#s4-note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.9);
      tl.fromTo("#s4-end", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 13.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
