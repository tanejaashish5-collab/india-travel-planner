# Weekly off-platform DB backup (2026-06-10 audit finding: 3 destructive prod
# sweeps in 48h; only restore today is Supabase Pro's 7-day window, which
# becomes ZERO on a free-tier downgrade).
#
# Store: GitHub Actions artifacts, retention 56 days = ~8 weekly copies.
#   - db-backup-content            : public site content tables (plaintext ok —
#                                    this data is already public on nakshiq.com)
#   - db-backup-private-encrypted  : PII tables (emails/user ids), AES-256-GCM
#                                    encrypted with BACKUP_PASSPHRASE.
#   NOTE: this repo is PUBLIC, so artifacts are world-downloadable — the script
#   therefore NEVER emits plaintext PII in this workflow.
#
# Optional upgrade path: create a PRIVATE R2 bucket "nakshiq-backups" with an
# account-scoped token and add BACKUP_R2_ACCOUNT_ID / BACKUP_R2_ACCESS_KEY_ID /
# BACKUP_R2_SECRET_ACCESS_KEY secrets — the same script then uploads + prunes
# (keeps newest 8) by switching --target r2 below.
#
# Required secrets:
#   SUPABASE_DB_URL    direct-Postgres connection string (Session pooler URI,
#                      port 5432) from the Supabase dashboard. NOT set yet as
#                      of 2026-06-10 — the run fails fast with instructions
#                      until the founder adds it.
#   BACKUP_PASSPHRASE  symmetric key for the encrypted PII archive (set).

name: db-backup

on:
  schedule:
    - cron: "30 2 * * 0" # Sundays 02:30 UTC (~08:00 IST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secret
        env:
          DB_URL_SET: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$DB_URL_SET" != "true" ]; then
            {
              echo "## db-backup blocked: SUPABASE_DB_URL secret is missing"
              echo "Get the Session-pooler URI (with password, port 5432) from"
              echo "https://supabase.com/dashboard/project/dudzsdzfvikjjhurxrgc/settings/database"
              echo 'then run: gh secret set SUPABASE_DB_URL --body "postgresql://..."'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SUPABASE_DB_URL secret is missing — see job summary." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install postgresql-client-17 (pg_dump must be >= server major 17)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Install script deps in scratch dir (skip full monorepo install)
        run: |
          mkdir -p /tmp/backup-deps && cd /tmp/backup-deps
          npm init -y > /dev/null
          npm install --no-audit --no-fund pg@^8 @aws-sdk/client-s3@^3

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DEPS_DIR: /tmp/backup-deps/node_modules
          # Flip to "--target r2" once BACKUP_R2_* secrets exist:
          BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: |
          node scripts/backup-content-tables.mjs --out .backups --target artifact
          {
            echo "## db-backup manifest"
            echo '```json'
            cat .backups/nakshiq-backup-manifest-*.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard — no plaintext PII may leave this job
        run: |
          if ls .backups/nakshiq-private-*.sql.gz .backups/nakshiq-private-*.dump 2>/dev/null | grep -v '\.enc$'; then
            echo "FATAL: plaintext private archive present in a public-repo workflow" >&2
            exit 1
          fi
          echo "OK: no plaintext private archive on disk"

      - name: Upload content artifact (public site data only)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-content-${{ github.run_id }}
          path: |
            .backups/nakshiq-content-*
            .backups/nakshiq-backup-manifest-*.json
          retention-days: 56
          if-no-files-found: error

      - name: Upload encrypted private artifact (PII, AES-256-GCM)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-private-encrypted-${{ github.run_id }}
          path: .backups/nakshiq-private-*.enc
          retention-days: 56
          if-no-files-found: warn
