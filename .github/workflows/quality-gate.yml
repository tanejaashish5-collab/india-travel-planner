name: Quality Gate

on:
  schedule:
    # Daily 02:00 UTC ≈ 07:30 IST. Catches drift introduced by autoposter
    # cron jobs (which can re-introduce thin destination_months rows when
    # they blank out a cell during refresh).
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit-thin-content.mjs"
      - "scripts/audit-hreflang.mjs"
      - "supabase/migrations/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/audit-render-modes.mjs"

env:
  BASE: https://www.nakshiq.com

jobs:
  # The `secrets` context is NOT allowed in job-level `if:` expressions.
  # `if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}` on thin-content made
  # the whole workflow file invalid — every run failed at the WORKFLOW level
  # in 0s with no jobs executed (100/100 recent runs), so PRs merged with zero
  # checks. Standard fix: compute the check in a step (where `secrets` IS
  # allowed) and gate the job on the resulting job output.
  preflight:
    name: Secrets preflight
    runs-on: ubuntu-latest
    outputs:
      has-supabase: ${{ steps.check.outputs.has-supabase }}
    steps:
      - name: Detect SUPABASE_SERVICE_ROLE_KEY
        id: check
        run: echo "has-supabase=${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}" >> "$GITHUB_OUTPUT"

  thin-content:
    name: Thin-content gate (R2 §9 #4)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has-supabase == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit destination_months for sub-150-char "go" pages
        run: node scripts/audit-thin-content.mjs --ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  hreflang-and-schema:
    name: hreflang + JSON-LD audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify hreflang + JSON-LD on representative URLs
        run: node scripts/audit-hreflang.mjs
        env:
          BASE: ${{ env.BASE }}

  render-mode:
    name: Render-mode regression check (M5)
    runs-on: ubuntu-latest
    # Runs on PR + push to main + manual dispatch. Skipped on the daily
    # schedule — no fresh build artefact, and re-running against stale
    # `.next/` gives a false-pass. PR trigger catches the regression
    # BEFORE merge, which the 2026-05-05 ISR incident needed.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build apps/web
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Audit render modes vs baseline
        run: node scripts/audit-render-modes.mjs
