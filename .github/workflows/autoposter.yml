name: Nakshiq Autoposter

on:
  schedule:
    # ── Schedule rationale (2026-05-10 rewrite) ──────────────────────
    # GHA silently SKIPS scheduled workflows on heavy minute marks
    # (:00, :15, :30, :45) during high-load periods. Evidence from
    # autoposter.log 2026-05-04 → 2026-05-09:
    #   - "0 10 * * *" (reel-map, top-of-hour) skipped 2 days running
    #     → pomelli content went dark for 3 days
    #   - "30 3 * * *" (morning post) skipped or delayed 3+ hours
    #     on 9 of 11 days
    # Fix: every cron now lands on :17 or :47 — far from any heavy
    # boundary. All times stay inside their mode-detection windows
    # below so the bash routing logic doesn't need to change.
    #
    # 2026-05-16 CADENCE CUT — pivoting from 6 IG+FB posts/day to 2.
    # User diagnosis: 215 IG posts → 2 organic followers. Algorithm penalty
    # for sub-1k accounts at >2-3 posts/day. Quality > volume until first
    # 1k followers crossed. Reel slot, visual slot, reel-map, flow-story
    # all paused. Morning + Evening only. YT keeps 2/day (different ceiling).
    #
    # Morning post: 08:47 IST (03:17 UTC) — PAUSED 2026-07-01. The daily
    # verified-data CAROUSEL (12:47 IST) replaces this score-heavy feed slot so
    # net IG cadence stays ~4/day (sub-10K throttle) and scores stop dominating.
    # Re-enable by uncommenting if carousel reach underperforms.
    # - cron: "17 3 * * *"
    # YT Short slot 1: 12:17 IST (06:47 UTC) — the ONE daily reel, YT + IG.
    # Moved 2026-09-13 from 09:47 IST. Our own ledger: IG reels posted at noon
    # IST reach a median of 142 (n=18) vs 109 at 18:00 (n=27) and 115 pooled.
    #
    # 2026-09-15 — FIRE EARLY, THEN WAIT. Measured, not assumed: over
    # 09-07..09-15 the daily reel published at 14:56, 14:29, 14:34, 14:32,
    # 14:31, 14:13, 15:29, 15:46 and 15:16 IST. Not once at noon. GitHub
    # delays this repo's scheduled workflows by a median of ~2h10m, with two
    # days at 5h30m and 6h30m (n=9 first-fires of this cron), and the watchdog
    # catch-up — which is what actually publishes on most days — is delayed
    # the same way. Our own ledger puts IG reel reach at a median of 142 at
    # 12:00 IST vs 109 at 18:00, so the scheduler was throwing away the
    # best-evidenced lever we own.
    #
    # Moving the cron alone CANNOT fix this. The delay is variable (94–680
    # min observed), so an earlier cron just relocates the same spread. The
    # fix is to make the delay irrelevant: fire early at 02:47 UTC
    # (08:17 IST) and let the `gate` job below hold the run until 06:30 UTC
    # = 12:00 IST exactly, then publish. A run that arrives after 12:00 IST
    # publishes immediately — so the worst case is what we already have.
    #
    # Why 02:47 rather than something tighter: the delay is not the same for
    # every workflow in this repo, and it is getting WORSE. quality-gate
    # (cron "0 2") landed at 06:37-07:30 UTC on 14 consecutive days — 4.6 to
    # 5.5h late. db-backup (cron "30 2 * * 0") landed at 03:27/03:29 in
    # mid-August and 07:15/07:36 in September. So 02:47 buys the biggest
    # margin that still leaves a short hold on a good day, and idle runner
    # time is free here: this repo is PUBLIC, so Actions minutes are
    # unmetered. MAX_HOLD in the gate stops that becoming an all-day idle if
    # a cron ever fires early.
    #
    # HONEST LIMIT, measured: on that evidence GitHub may not start this
    # repo's early-UTC runs before ~06:30 UTC at all, in which case the gate
    # has nothing to hold and publishes on arrival — no worse than today, but
    # no better either. The gate can only improve the timing, never worsen
    # it, and it starts delivering noon the day GitHub's scheduler recovers.
    # Pinning noon regardless needs an external nudge: workflow_dispatch is
    # NOT delayed (watchdog dispatches reach publish in ~7 min), so a Vercel
    # or Cloudflare cron calling the dispatch API at 06:23 UTC would be
    # exact. That needs a `workflow`-scoped token placed outside GitHub —
    # a founder decision, not a code change.
    #
    # IST has no DST: 06:30 UTC is 12:00 IST every day of the year. The
    # four-fire AEST/AEDT dance in run-social-local.sh is a LOCAL-clock
    # problem and has no equivalent here.
    #
    # Why this did NOT move to the Mac (founder decision 2026-09-15): the
    # LaunchAgent fires on time but publishes nothing when the machine is
    # asleep at 16:30 AEST. run-social-local.sh §3 stays DORMANT
    # (NAKSHIQ_LOCAL_DAILY_REEL=0). GitHub keeps the slot; the gate fixes
    # the timing. Never arm both — same collision rule as the ga4-audit
    # crontab line.
    - cron: "47 2 * * *"
    # Retired 2026-09-15 — the old reel slot (12:17 IST nominal). Out of the
    # schedule, but still MAPPED in "Set run mode" below so a fire of it that
    # GitHub is holding when this ships routes to --yt-short instead of
    # falling through to wall-clock dispatch.
    # - cron: "47 6 * * *"
    # Reel slot 1: PAUSED 2026-05-16 — was 11:17 IST. Resume after 1k followers.
    # - cron: "47 5 * * *"
    # Visual slot: PAUSED 2026-05-16 — was 13:17 IST (moat/tourist-map/canva/
    # pomelli rotation). Brand-manifesto content earned zero engagement; only
    # rich-data verdict/verification posts (Morning + Evening) remain.
    # - cron: "47 7 * * *"
    # Reel-map: PAUSED 2026-05-16 — was 15:17 IST Tue/Thu/Sat. Pomelli pipeline
    # not converting; pause until visual content earns first 50-engagement post.
    # - cron: "47 9 * * *"
    # Flow story: PAUSED 2026-05-16 — was 16:17 IST Sun only.
    # - cron: "47 10 * * *"
    # YT Short slot 2: PAUSED 2026-09-13. Two-to-three Shorts a day earned a
    # median of 10-21 views on a 10-subscriber channel (n=217). Cadence is not
    # the lever on YouTube; retention is. One render a day, judged on
    # averageViewPercentage, not on how many we ship.
    # - cron: "47 11 * * *"
    # Carousel: PAUSED 2026-09-08 (founder option A). 65 IG carousels reached a
    # median of 2 people each (post_engagement.json, May 25-Sep 7) — only the
    # founder's own accounts. IG is reels-only, 1/day, until the account
    # escapes cold start (target: 100 real followers by 2026-10-20).
    # 2026-09-22 RESTORED for FACEBOOK ONLY (founder: "keep facebook separate
    # as before"). autoposter.py sets NAKSHIQ_FB_ONLY for --carousel, so IG
    # stays reels-only 1/day and this slot cannot consume IG's daily slot.
    - cron: "17 7 * * *"
    # Reel Studio: PAUSED 2026-09-13. The IG cap is 1 reel/day and that slot now
    # belongs to the founder-voice test (T1, rendered + published locally by
    # com.nakshiq.voice-reel). A second render would be silently dropped by
    # NAKSHIQ_IG_DAILY_CAP anyway; pausing it saves the compute and keeps the
    # test arm clean. See docs/social-strategy-2026-09-13.md.
    # - cron: "47 5 * * 1,3,5"
    # Evening post: PAUSED 2026-09-08 (founder option A). Score-card image
    # posts reach ~2 people (see carousel note above). The IG cap of 1 reel/day
    # is ALSO enforced inside autoposter.py (NAKSHIQ_IG_DAILY_CAP), so a
    # drifted cron or a watchdog catch-up cannot exceed it.
    # 2026-09-22 RESTORED for FACEBOOK ONLY (same as the carousel above).
    - cron: "17 14 * * *"
    # Reel slot 2: REMOVED 2026-05-10 (Tier 3 cadence cut: 6→4 IG posts/day to
    # respect IG's algorithmic penalty for sub-10K-follower accounts posting >3/day).
    # Analytics sync: 23:47 IST (18:17 UTC) — internal
    - cron: "17 18 * * *"
    # Engagement pull: 02:47 IST next day (21:17 UTC) — daily, internal
    # Pulls likes/comments/saves/shares/reach/views from Outstand /analytics
    # for posts in the last 7 days (Tier 2, 2026-05-10).  Runs after evening
    # publish so latest posts have ~6h to accumulate engagement before pull.
    - cron: "17 21 * * *"
    # Weekly engagement digest: Sun 03:47 IST Mon (Sun 22:17 UTC) — internal
    # Aggregates the week's engagement into data/research/social-engagement-week-*.md.
    # Runs after Sunday's engagement pull (21:17 UTC) so the digest is fresh.
    - cron: "17 22 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (leave blank for normal). --force variants removed 2026-05-26 (Phase C) — they bypass dedup and caused the 2026-05-25 triple-publish. For emergency override, run locally with --force."
        required: false
        default: ""
        type: choice
        options:
          # Phase C 2026-05-26: ALL `*-force` variants and the bare `force`
          # option removed. They bypassed every dedup gate (per-account
          # posted_today + Outstand-side remote_today) and caused the
          # Uttarakhand triple-publish incident when the watchdog dispatched
          # them after a drifted slot. Emergency override is now intentional
          # friction: run nakshiq-autoposter/autoposter.py --force from a
          # local checkout where the operator has to consciously type --force.
          - ""
          - sync-only
          - dry-run
          - evening
          - moat
          - tourist-map
          - canva-visual
          - reel
          - infographic
          - pomelli-visual
          - flow-story
          - reel-map
          - yt-short
          # Skips the gate job's 12:00 IST hold. Use when you want the reel
          # out NOW; plain `yt-short` waits for noon IST like the cron does.
          - yt-short-now
          - analytics
          # Phase C 2026-05-26: dry-run variants for dark/paused formats.
          # Routes to `--dry-run --<format>` so the full pipeline runs up
          # to publish_* but never calls Outstand. Use to validate that
          # infographic/tourist-map/reel-map/pomelli-visual/flow-story
          # pipelines still work before re-enabling their crons.
          - dry-run-carousel
          - dry-run-infographic
          - dry-run-tourist-map
          - dry-run-reel-map
          - dry-run-pomelli-visual
          - dry-run-flow-story

concurrency:
  group: autoposter
  # 2026-05-12: was `true` — but that meant a delayed-scheduled fire (GHA can be
  # 1-3h late on UTC-night crons) got cancelled the moment ANY manual dispatch
  # or watchdog-trigger queued. Now `false` so runs serialize through the
  # concurrency group; the script-level `.autoposter.lock` already prevents
  # genuine simultaneous-publish issues.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 2026-09-22 (founder): Facebook back on, as its own strategy — carousel +
  # evening slots, FB-only. Instagram is unchanged (1 reel/day cap).
  NAKSHIQ_FB_ENABLED: "1"

jobs:
  # ── PUBLISH-TIME GATE (2026-09-15) ───────────────────────────────────────
  # GitHub decides when this workflow STARTS. This job decides when it
  # PUBLISHES. It is the whole point of the early 03:47 UTC cron above: it
  # absorbs the scheduler's 2-6h delay by holding until 06:30 UTC (12:00 IST)
  # and only then letting `post` run.
  #
  # It also closes a SECOND defect, found in the ledger the same day: YouTube
  # was still getting 2 shorts a day (09-11 got three) months after the
  # 2026-09-13 strategy cut it to one. Cause: the watchdog catch-up publishes
  # around 14:00 IST, then the delayed cron arrives hours later and publishes
  # AGAIN. Instagram survives that only because autoposter.py caps it
  # (NAKSHIQ_IG_DAILY_CAP, default 1) — YouTube has no such cap. The
  # already-published check below is that missing cap, applied at the
  # workflow level so it covers every surface and every trigger.
  #
  # Why a separate job: `post` carries timeout-minutes: 15 to kill a hung apt
  # mirror (2026-05-07). That ceiling protects a real failure mode and must
  # not be raised just to make room for a sleep.
  gate:
    runs-on: ubuntu-latest
    # The 5h hold ceiling below, plus slack. GitHub's own per-job cap is 6h.
    timeout-minutes: 330
    outputs:
      proceed: ${{ steps.hold.outputs.proceed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Hold the daily reel until 12:00 IST
        id: hold
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -uo pipefail
          set +e   # several checks below are MEANT to return non-zero; we branch on it

          # Fail LOUD rather than silently skipping the day. Every path below
          # writes a decision and exits — but if one ever crashes without
          # writing, `post` would be skipped while the run still went green,
          # and watchdog.py's slot_covered() would count that green run as
          # covering the slot. The reel would then never go out, and nothing
          # would say so. Same shape as the cron-ok:true-while-everything-
          # failed class. Exiting non-zero makes the slot look uncovered, so
          # the watchdog dispatches a catch-up.
          gate_exit() {
            local rc=$?
            if [ "$rc" -eq 0 ] && ! grep -q '^proceed=' "$GITHUB_OUTPUT" 2>/dev/null; then
              echo "::error::gate exited 0 without writing a decision — failing the run so the watchdog dispatches a catch-up"
              exit 1
            fi
          }
          trap gate_exit EXIT
          TARGET_UTC="06:30"   # 12:00 IST. IST has no DST, so this is fixed year-round.
          MAX_HOLD=18000       # 5h ceiling — a wildly early fire must not idle a runner all day.

          # ── 1. Is this the daily reel? ──────────────────────────────────
          # Everything else (analytics, engagement pull, weekly digest, dry
          # runs, sync-only) passes straight through. Those have no
          # publish-time to protect and must never be delayed by this gate.
          IS_REEL=0
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHED" in
              "47 2 * * *"|"47 6 * * *") IS_REEL=1 ;;
            esac
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "yt-short" ]; then
            # The watchdog's catch-up path. On most days this is what ACTUALLY
            # publishes, so it has to hold too — gating only the cron would be
            # theatre. `yt-short-now` deliberately does not match: that is the
            # manual publish-immediately override.
            IS_REEL=1
          fi
          if [ "$IS_REEL" -ne 1 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Not the daily reel (event=$EVENT schedule='$SCHED' mode='$INPUT_MODE') — no hold, no dedup check."
            exit 0
          fi

          published_today() {
            # origin/autoposter-state is the only real ledger — the copy on
            # main froze in April. A fetch failure here must NOT block the
            # publish: this check exists to stop a DUPLICATE, while the `post`
            # job runs its own state sync that hard-fails when the branch is
            # unreachable. Fail-open here, fail-closed there.
            if ! git fetch origin autoposter-state --depth=1 -q 2>/dev/null; then
              echo "  state branch unreachable — skipping the duplicate check (the post job's own sync is the hard gate)"
              return 1
            fi
            HIT="$(git show origin/autoposter-state:nakshiq-autoposter/data/post_log.jsonl 2>/dev/null | python3 nakshiq-autoposter/scripts/reel_published_today.py)"
            RC=$?
            if [ "$RC" -eq 10 ]; then
              echo "  today's reel is already in the ledger: $HIT"
              return 0
            fi
            return 1
          }

          # ── 2. Already out today? Then this is a duplicate trigger ───────
          # Exactly the shape that was giving YouTube 2-3 shorts a day.
          if published_today; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Daily reel already published — standing this trigger down."
            exit 0
          fi

          # ── 3. Hold until 12:00 IST ─────────────────────────────────────
          # python3 rather than GNU date's -d flag, which is GNU-only. The
          # runner is Ubuntu so either works there, but nobody could exercise
          # this branch on a Mac — and an untestable branch is exactly how a
          # hold silently becomes a no-op. Keeping it portable is what let the
          # hold loop be tested before it shipped.
          NOW=$(date -u +%s)
          TARGET=$(python3 -c "import datetime as dt, sys; h, m = sys.argv[1].split(':'); n = dt.datetime.now(dt.timezone.utc); print(int(n.replace(hour=int(h), minute=int(m), second=0, microsecond=0).timestamp()))" "$TARGET_UTC")
          case "$TARGET" in
            ''|*[!0-9]*)
              # Without this, the arithmetic below runs on an empty string and
              # falls through to "publishing immediately" with a nonsense
              # minutes-late figure — a broken clock reading as a late run.
              echo "::error::could not compute the 12:00 IST target from TARGET_UTC='$TARGET_UTC' — failing rather than guessing a publish time"
              exit 1
              ;;
          esac
          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT=$((TARGET - NOW))
            if [ "$WAIT" -gt "$MAX_HOLD" ]; then
              echo "::warning::Hold of ${WAIT}s exceeds the ${MAX_HOLD}s ceiling — capping it. A run arriving this early is unexpected; check the cron."
              WAIT=$MAX_HOLD
            fi
            echo "Holding ${WAIT}s — publishing at ${TARGET_UTC} UTC = 12:00 IST."
            REMAIN=$WAIT
            while [ "$REMAIN" -gt 0 ]; do
              CHUNK=300
              [ "$REMAIN" -lt 300 ] && CHUNK=$REMAIN
              sleep "$CHUNK"
              REMAIN=$((REMAIN - CHUNK))
              echo "  … $((REMAIN / 60)) min to 12:00 IST"
            done
          else
            echo "::warning::This run reached the gate $(( (NOW - TARGET) / 60 )) min AFTER 12:00 IST — publishing immediately rather than losing the day. If that happens every day, the cron has to move earlier again."
          fi

          # ── 4. Re-check before opening ──────────────────────────────────
          # Catches a publish that happened DURING the hold from outside this
          # workflow — a local run, or run-social-local.sh §3 if it is ever
          # armed. Runs of this workflow serialise through the `autoposter`
          # concurrency group, so those are already caught at step 2.
          if published_today; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Something else published while this run was holding — standing down."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Gate open at $(date -u '+%H:%M UTC') — publishing the daily reel."

  post:
    needs: gate
    # gate returns false ONLY when today's reel is already in the ledger.
    # A skipped `post` still leaves the run itself successful, which is what
    # watchdog.py's slot_covered() reads — so a stood-down duplicate
    # correctly counts as "the slot fired" instead of triggering another
    # catch-up.
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: nakshiq-autoposter/requirements.txt

      - name: Install ffmpeg (system package with drawtext/freetype)
        run: |
          # Wrap apt-get in `timeout` so a hung Ubuntu 24.04 apt mirror can't
          # burn the entire 15-min job budget. Today (2026-05-07 06:24-06:37 UTC)
          # the FIRST install hung silently for 13 min before the job-level
          # timeout killed the run with no posts. Bounded retries make the
          # failure mode "fail fast in <5 min" instead of "hang for 15 min".
          timeout 90 sudo apt-get install -y -qq ffmpeg 2>/dev/null || {
            echo "Initial ffmpeg install timed out or failed — retrying after update..."
            timeout 60 sudo apt-get update -qq || true
            timeout 120 sudo apt-get install -y -qq ffmpeg || {
              echo "::error::ffmpeg install failed twice — aborting job."
              exit 1
            }
          }
          ffmpeg -filters 2>/dev/null | grep -c draw
          which ffmpeg

      - name: Install Python dependencies
        run: pip install -r nakshiq-autoposter/requirements.txt

      - name: Sync latest autoposter state from autoposter-state branch
        # State files (state.json / autoposter.log / analytics.json /
        # post_engagement.json / post_outcomes.jsonl) live on the
        # `autoposter-state` side branch so they don't trigger Vercel rebuilds
        # on main. Pull the latest state into the main worktree before the
        # autoposter runs so it sees yesterday's already-posted content.
        #
        # 2026-05-26: per-file loop instead of one multi-pathspec checkout.
        # The previous form failed entirely when ANY listed file was absent
        # from the branch (e.g. post_engagement.json — only created when
        # the engagement-pull cron writes it) — `2>/dev/null || true` then
        # swallowed the error and the runner started with NO synced state.
        # That made post_log.jsonl empty → destinations_posted_today_jsonl()
        # returned an empty set → same-day-dest guard never fired → repeat
        # publishes (Uttarakhand triple-post 2026-05-25). Iterating per-file
        # mirrors the commit step further down: one missing file no longer
        # blocks the others.
        run: |
          if git ls-remote --exit-code --heads origin autoposter-state >/dev/null 2>&1; then
            git fetch origin autoposter-state --depth=1
            # Phase C 2026-05-26: hard-fail when a file that EXISTS on the
            # remote fails to check out (vs. the old `|| true` that silently
            # masked both "file absent on remote" AND "checkout itself failed"
            # — the latter is the Uttarakhand triple-publish root cause).
            # Now: cat-file -e probes existence first; if present, the
            # checkout must succeed; if absent, we log + continue (first-run
            # / pre-engagement-pull cases).
            sync_failed=0
            for f in nakshiq-autoposter/state.json \
                     nakshiq-autoposter/autoposter.log \
                     nakshiq-autoposter/analytics.json \
                     nakshiq-autoposter/data/post_engagement.json \
                     nakshiq-autoposter/data/post_outcomes.jsonl \
                     nakshiq-autoposter/data/post_log.jsonl \
                     nakshiq-autoposter/data/posted_today.jsonl \
                     nakshiq-autoposter/data/theme_usage.jsonl; do
              if git cat-file -e "origin/autoposter-state:$f" 2>/dev/null; then
                if ! git checkout origin/autoposter-state -- "$f"; then
                  echo "::error::sync: file exists on remote but checkout FAILED: $f"
                  sync_failed=1
                fi
              else
                echo "  [sync] $f not on remote yet (first-run / not-yet-created — OK)"
              fi
            done
            if [ "$sync_failed" -ne 0 ]; then
              echo "::error::One or more state files failed to sync — refusing to proceed. Dedup would run on stale data."
              exit 1
            fi
            echo "Synced state from autoposter-state branch"
          else
            echo "autoposter-state branch not on origin yet — using state from main checkout (first run)"
          fi

      - name: Cache social image library
        uses: actions/cache@v4
        with:
          path: nakshiq-autoposter/social_image_library
          # 2026-05-26: bumped v1 → v2 to invalidate cached blank/no-photo
          # branded badges for 36 dests across OD/AN/LA/PU/DA (Puri Story
          # incident — the asset-gen pipeline silently skipped photo
          # compositing for these regions and shipped text-only overlays
          # that IG rendered as blank-green stories). Local files are
          # deleted; this bump forces the runner to drop its cached copies
          # so the autoposter falls back to the real R2 destination photo.
          key: social-image-library-v2

      - name: Generate social image library (if not cached)
        run: |
          if [ ! -d "nakshiq-autoposter/social_image_library" ] || [ $(find nakshiq-autoposter/social_image_library -name "*.jpg" 2>/dev/null | wc -l) -lt 100 ]; then
            echo "Generating social image library..."
            python nakshiq-autoposter/dest_image_gen.py --limit 0
          else
            echo "Social image library cached ($(find nakshiq-autoposter/social_image_library -name '*.jpg' | wc -l) images)"
          fi

      # 2026-05-20: Phase 2 asset sync from the nakshiq-images R2 bucket.
      # Driven by a manifest file (data/phase2_r2_manifest.txt — one filename
      # per line) so the workflow only fetches assets the user has actually
      # uploaded to R2.
      # Layout in R2: nakshiq-images/social_image_library/{format_id}-{dest_slug}.{ext}
      # Layout locally: nakshiq-autoposter/social_image_library/{same name}
      # Bucket is public (Public Access enabled), no credentials required.
      # Public URL prefix confirmed against qa/hero-images.json which uses
      # the same bucket for destination hero images.
      - name: Sync Phase 2 assets from R2
        run: |
          MANIFEST="nakshiq-autoposter/data/phase2_r2_manifest.txt"
          if [ ! -f "$MANIFEST" ]; then
            echo "No Phase 2 manifest — skipping R2 sync (Phase 2 not yet activated)"
            exit 0
          fi
          R2_BASE="https://pub-d8970c901de34c218926ebf4be1ed09a.r2.dev/social_image_library"
          LIB="nakshiq-autoposter/social_image_library"
          mkdir -p "$LIB"
          fetched=0
          skipped=0
          missing=0
          while IFS= read -r asset || [ -n "$asset" ]; do
            # Skip blanks + comment lines
            case "$asset" in ''|'#'*) continue ;; esac
            asset=$(echo "$asset" | tr -d '\r' | xargs)
            [ -z "$asset" ] && continue
            target="$LIB/$asset"
            if [ -f "$target" ] && [ -s "$target" ]; then
              skipped=$((skipped + 1))
              continue
            fi
            if curl -fsSL -o "$target.tmp" "$R2_BASE/$asset"; then
              mv "$target.tmp" "$target"
              fetched=$((fetched + 1))
            else
              rm -f "$target.tmp"
              missing=$((missing + 1))
              echo "  [phase2] not in R2: $asset"
            fi
          done < "$MANIFEST"
          echo "Phase 2 R2 sync: fetched=$fetched skipped=$skipped missing=$missing"

      - name: Set run mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          TOTAL_MINS=$((10#$HOUR * 60 + 10#$MINUTE))
          DOW=$(date -u +%u)  # 1=Mon .. 7=Sun
          INPUT="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"

          # ── Schedule-expression dispatch (fixes GHA cron drift) ──────────
          # When GHA fires a cron 30-150min late, wall-clock-based dispatch
          # below can land in the WRONG window (e.g. 2026-05-24: the 04:17
          # YT-short cron fired at 06:47 → "drift to MORNING POST" branch,
          # silently dropping the YT short slot). github.event.schedule
          # carries the EXACT cron expression that triggered this run, so we
          # can map cron → mode deterministically regardless of fire delay.
          # Falls through to the wall-clock branch only for workflow_dispatch
          # or if a new cron is added without a mapping here.
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$SCHED" ]; then
            case "$SCHED" in
              "17 3 * * *")
                echo "args=" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: morning post (UTC ${HOUR}:${MINUTE}, drift-tolerant)"
                exit 0
                ;;
              "47 2 * * *"|"47 6 * * *")
                echo "args=--yt-short" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --yt-short, the single daily reel. The gate job has already held this run until 12:00 IST (now UTC ${HOUR}:${MINUTE}). '47 6' is the slot retired 2026-09-15, still mapped so a late fire of it routes here rather than to wall-clock."
                exit 0
                ;;
              # Retired 2026-09-13 — kept so a late fire of an old cron still
              # maps to a mode instead of falling through to wall-clock.
              "17 4 * * *"|"47 11 * * *")
                echo "args=--yt-short" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --yt-short (retired slot, UTC ${HOUR}:${MINUTE})"
                exit 0
                ;;
              "17 7 * * *")
                echo "args=--carousel" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --carousel (UTC ${HOUR}:${MINUTE}, drift-tolerant)"
                exit 0
                ;;
              "47 5 * * 1,3,5")
                echo "args=--reel-studio" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --reel-studio (UTC ${HOUR}:${MINUTE}, Mon/Wed/Fri)"
                exit 0
                ;;
              "17 14 * * *")
                echo "args=--evening" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --evening (UTC ${HOUR}:${MINUTE}, drift-tolerant)"
                exit 0
                ;;
              "17 18 * * *")
                echo "args=--analytics" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --analytics (UTC ${HOUR}:${MINUTE}, drift-tolerant)"
                exit 0
                ;;
              "17 21 * * *")
                echo "args=--engagement-pull" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --engagement-pull (UTC ${HOUR}:${MINUTE}, drift-tolerant)"
                exit 0
                ;;
              "17 22 * * 0")
                echo "args=--digest-weekly" >> $GITHUB_OUTPUT
                echo "Cron-expression dispatch: --digest-weekly (UTC ${HOUR}:${MINUTE}, Sunday-only)"
                exit 0
                ;;
              *)
                echo "::warning::Unrecognised cron schedule '$SCHED' — falling through to wall-clock dispatch. Add a case branch above for this cron."
                ;;
            esac
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Phase C 2026-05-26: all `*-force` branches removed. The choice list
            # no longer exposes them, but we still hard-block any operator who
            # paste-types the old strings via the API — there is no path through
            # this routing that emits --force.
            case "$INPUT" in
              *-force|force)
                echo "::error::--force dispatch has been disabled (Phase C). Run autoposter.py --force locally if emergency override is needed."
                exit 1
                ;;
            esac
            if [ "$INPUT" = "dry-run-carousel" ]; then
              echo "args=--dry-run --carousel" >> $GITHUB_OUTPUT
              echo "Manual mode: --dry-run --carousel (no Outstand POST; validates the editorial renderer on the runner)"
            elif [ "$INPUT" = "dry-run-infographic" ]; then
              echo "args=--dry-run --infographic" >> $GITHUB_OUTPUT
              echo "Manual mode: --dry-run --infographic (no Outstand POST)"
            elif [ "$INPUT" = "dry-run-tourist-map" ]; then
              echo "args=--dry-run --tourist-map" >> $GITHUB_OUTPUT
              echo "Manual mode: --dry-run --tourist-map (no Outstand POST)"
            elif [ "$INPUT" = "dry-run-reel-map" ]; then
              echo "args=--dry-run --reel-map" >> $GITHUB_OUTPUT
              echo "Manual mode: --dry-run --reel-map (no Outstand POST)"
            elif [ "$INPUT" = "dry-run-pomelli-visual" ]; then
              echo "args=--dry-run --pomelli-visual" >> $GITHUB_OUTPUT
              echo "Manual mode: --dry-run --pomelli-visual (no Outstand POST)"
            elif [ "$INPUT" = "dry-run-flow-story" ]; then
              echo "args=--dry-run --flow-story" >> $GITHUB_OUTPUT
              echo "Manual mode: --dry-run --flow-story (no Outstand POST)"
            elif [ "$INPUT" = "yt-short-now" ]; then
              # The gate job recognises this mode and skips its hold, so we
              # just map it onto the ordinary reel flag here.
              echo "args=--yt-short" >> $GITHUB_OUTPUT
              echo "Manual mode: --yt-short (publish-now override — the 12:00 IST hold was skipped)"
            elif [ -n "$INPUT" ]; then
              echo "args=--${INPUT}" >> $GITHUB_OUTPUT
              echo "Manual mode: --${INPUT}"
            else
              echo "args=" >> $GITHUB_OUTPUT
              echo "Manual mode: normal (post)"
            fi
          # ── Optimized schedule: 9 daily slots, 2hr+ gaps, all IST ──
          # Windows are now CONTIGUOUS midpoint-bounded ranges (each cron is
          # the centre of its window) so GHA scheduling drift in either
          # direction can't drop a slot into --sync-only. Yesterday (2026-05-05)
          # the evening cron drifted -14 min to 12:46 UTC = 766, which fell
          # below the old window start of 770 → silent --sync-only. The new
          # evening window 735-839 captures it.
          #
          # 08:47 IST = UTC 03:17 → morning post (cron=197, window: 180-239)
          elif [ "$TOTAL_MINS" -ge 180 ] && [ "$TOTAL_MINS" -lt 240 ]; then
            echo "args=" >> $GITHUB_OUTPUT
            echo "Scheduled POST mode · 09:00 IST (UTC ${HOUR}:${MINUTE})"

          # 09:47 IST = UTC 04:17 → YT Short slot 1 (cron=257, window: 240-299)
          elif [ "$TOTAL_MINS" -ge 240 ] && [ "$TOTAL_MINS" -lt 300 ]; then
            echo "args=--yt-short" >> $GITHUB_OUTPUT
            echo "Scheduled YT SHORT slot 1 · 10:00 IST (UTC ${HOUR}:${MINUTE})"

          # 11:17 IST = UTC 05:47 → Reel slot 1 (cron=347, window: 300-389)
          elif [ "$TOTAL_MINS" -ge 300 ] && [ "$TOTAL_MINS" -lt 390 ]; then
            echo "args=--reel" >> $GITHUB_OUTPUT
            echo "Scheduled REEL slot 1 · 11:00 IST (UTC ${HOUR}:${MINUTE})"

          # 13:17 IST = UTC 07:47 → Visual slot (cron=467, window: 390-494)
          # 2026-05-16 PIVOT: visual slot PAUSED (cadence cut). The cron is
          # commented out so this branch should never fire from a fresh
          # cron — BUT a drifted morning cron (03:17 UTC scheduled, fires
          # late) lands in this window. So this branch now routes
          # drifted-late fires to morning-post mode instead of sync-only.
          # 2026-05-17 fix: previously dropped Sunday-morning drift to
          # --sync-only (Visual slot skipped), so today 0 posts fired.
          elif [ "$TOTAL_MINS" -ge 390 ] && [ "$TOTAL_MINS" -lt 495 ]; then
            echo "args=" >> $GITHUB_OUTPUT
            echo "Drifted MORNING post (cron drift, fired in old visual window) · DOW=${DOW}"

          # 15:17 IST = UTC 09:47 → Reel-map (cron=587, window: 570-614) — IG+FB+YT
          # TIER 3 (2026-05-10): DOW-gated to Tue/Thu/Sat only.  Pomelli pipeline
          # stays alive at 3×/wk; alternates with the M/W/F visual slot.
          elif [ "$TOTAL_MINS" -ge 570 ] && [ "$TOTAL_MINS" -lt 615 ]; then
            if echo "2 4 6" | grep -qw "$DOW"; then
              echo "args=--reel-map" >> $GITHUB_OUTPUT
              echo "Scheduled REEL-MAP · 15:17 IST Tue/Thu/Sat (UTC ${HOUR}:${MINUTE})"
            else
              echo "args=--sync-only" >> $GITHUB_OUTPUT
              echo "Reel-map skipped (Tier 3: Tue/Thu/Sat only) · DOW=${DOW}"
            fi

          # 16:17 IST = UTC 10:47 → Flow story (cron=647, window: 615-659) — IG+FB
          # TIER 3 (2026-05-10): DOW-gated to Sun only — replaces the Sat→canva
          # / Sun→pomelli rotation that the visual slot used to handle weekly.
          elif [ "$TOTAL_MINS" -ge 615 ] && [ "$TOTAL_MINS" -lt 660 ]; then
            if [ "$DOW" = "7" ]; then
              echo "args=--flow-story" >> $GITHUB_OUTPUT
              echo "Scheduled FLOW STORY · 16:17 IST Sun (UTC ${HOUR}:${MINUTE})"
            else
              echo "args=--sync-only" >> $GITHUB_OUTPUT
              echo "Flow-story skipped (Tier 3: Sun only) · DOW=${DOW}"
            fi

          # 17:17 IST = UTC 11:47 → YT Short slot 2 (cron=707, window: 660-739)
          elif [ "$TOTAL_MINS" -ge 660 ] && [ "$TOTAL_MINS" -lt 740 ]; then
            echo "args=--yt-short" >> $GITHUB_OUTPUT
            echo "Scheduled YT SHORT slot 2 · 17:17 IST (UTC ${HOUR}:${MINUTE})"

          # 19:47 IST = UTC 14:17 → Evening post (cron=857, window: 740-959)
          # Shifted +1h on 2026-05-15 to land inside India's IG peak engagement
          # window (19:00-21:00 IST) rather than 1h before it. Wide window
          # tolerates ±117/102 min of GHA scheduler drift.
          elif [ "$TOTAL_MINS" -ge 740 ] && [ "$TOTAL_MINS" -lt 960 ]; then
            echo "args=--evening" >> $GITHUB_OUTPUT
            echo "Scheduled EVENING · 19:47 IST (UTC ${HOUR}:${MINUTE})"

          # Reel slot 2 removed 2026-05-10 (Tier 3). Window 960-989 retained as
          # a sync-only fallback for post-evening drift (evening window ends
          # at 15:59 UTC = 960 mins after the 2026-05-15 +1h push).
          elif [ "$TOTAL_MINS" -ge 960 ] && [ "$TOTAL_MINS" -lt 990 ]; then
            echo "args=--sync-only" >> $GITHUB_OUTPUT
            echo "Post-evening drift fallback · sync-only"

          # 23:47 IST = UTC 18:17 → Analytics sync (cron=1097, window: 990-1199)
          elif [ "$TOTAL_MINS" -ge 990 ] && [ "$TOTAL_MINS" -lt 1200 ]; then
            echo "args=--analytics" >> $GITHUB_OUTPUT
            echo "Scheduled ANALYTICS · 23:47 IST (UTC ${HOUR}:${MINUTE})"

          # 02:47 IST next day = UTC 21:17 → Engagement pull (cron=1277, window: 1200-1379)
          # Tier 2 (2026-05-10): pulls likes/comments/saves/shares/reach/views
          # from Outstand /v1/posts/{id}/analytics for last 7 days of posts.
          # On Sundays (DOW=7) the 22:17 UTC window also fires the weekly digest.
          elif [ "$TOTAL_MINS" -ge 1200 ] && [ "$TOTAL_MINS" -lt 1380 ]; then
            # 22:17 UTC = 1337 mins → digest_weekly (Sunday only — DOW=7)
            if [ "$TOTAL_MINS" -ge 1320 ] && [ "$DOW" = "7" ]; then
              echo "args=--digest-weekly" >> $GITHUB_OUTPUT
              echo "Scheduled WEEKLY DIGEST · 03:47 IST Mon (UTC ${HOUR}:${MINUTE})"
            else
              echo "args=--engagement-pull" >> $GITHUB_OUTPUT
              echo "Scheduled ENGAGEMENT PULL · 02:47 IST (UTC ${HOUR}:${MINUTE})"
            fi

          else
            # Reachable only for off-schedule manual fires before 03:00 UTC
            # or after 20:00 UTC. Loud log so future drift > 60 min surfaces.
            echo "args=--sync-only" >> $GITHUB_OUTPUT
            echo "::warning::Off-schedule trigger fell through all windows — sync-only fallback (UTC ${HOUR}:${MINUTE} = ${TOTAL_MINS} mins). If this fires from a scheduled cron, the windows in autoposter.yml drifted more than 60 min and need re-tuning."
          fi

      - name: Run autoposter
        env:
          OUTSTAND_API_KEY: ${{ secrets.OUTSTAND_API_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          # Sunday --digest-weekly owned-audience section: absolute subscriber/
          # alert/trip-board counts via PostgREST HEAD count probes (zero-row
          # egress). Missing secrets degrade gracefully — the digest prints
          # "unavailable" instead of failing the run.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python nakshiq-autoposter/autoposter.py ${{ steps.mode.outputs.args }}

      - name: Check cooldown violations (non-blocking guardrail)
        # 2026-06-17: deterministic backstop for the pangong-lake 7×/14d class.
        # Replays the same 14d/30d/60d cooldown windows the autoposter enforces
        # against the freshly-written post_log and annotates the run if any
        # destination / (dest,fmt) / media repeated inside its window in the
        # last few days. Never blocks publishing — it surfaces a regression the
        # AI daily audit (which said "0 issues" the whole time) cannot see.
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if ! python3 nakshiq-autoposter/scripts/check_cooldown_violations.py --since-days 3; then
            echo "::warning title=Autoposter cooldown violation::A destination or (dest,fmt) repeated inside its cooldown window in the last 3 days — should not happen after the 2026-06-17 dedup fix. See step log."
          fi

      - name: Commit updated state to autoposter-state branch
        # Push the autoposter's state files to the side branch `autoposter-state`,
        # not to main. main only receives real code changes — Vercel deploys from
        # main, so this eliminates ~16 chore-driven rebuilds per day. A separate
        # worktree keeps the main checkout untouched.
        run: |
          set -e
          git config user.name  "Nakshiq Autoposter"
          git config user.email "autoposter@nakshiq.com"

          # 1. Snapshot autoposter's freshly-written state files
          mkdir -p /tmp/autoposter-snap
          [ -f nakshiq-autoposter/state.json ]                  && cp nakshiq-autoposter/state.json                  /tmp/autoposter-snap/state.json                  || true
          [ -f nakshiq-autoposter/autoposter.log ]              && cp nakshiq-autoposter/autoposter.log              /tmp/autoposter-snap/autoposter.log              || true
          [ -f nakshiq-autoposter/analytics.json ]              && cp nakshiq-autoposter/analytics.json              /tmp/autoposter-snap/analytics.json              || true
          [ -f nakshiq-autoposter/data/post_engagement.json ]   && cp nakshiq-autoposter/data/post_engagement.json   /tmp/autoposter-snap/post_engagement.json        || true
          [ -f nakshiq-autoposter/data/post_outcomes.jsonl ]    && cp nakshiq-autoposter/data/post_outcomes.jsonl    /tmp/autoposter-snap/post_outcomes.jsonl         || true
          # 2026-05-18: append-only JSONL files for post_log + theme_usage.
          # Snapshot them too so the worktree can MERGE (not overwrite) with
          # any newer remote entries that landed from a concurrent cron run.
          # 2026-05-26 (Phase C): added posted_today.jsonl — was local-only,
          # which meant the durable mirror of the same-account-today gate
          # vanished on each new runner, making cross-run dedup brittle.
          [ -f nakshiq-autoposter/data/post_log.jsonl ]         && cp nakshiq-autoposter/data/post_log.jsonl         /tmp/autoposter-snap/post_log.jsonl              || true
          [ -f nakshiq-autoposter/data/theme_usage.jsonl ]      && cp nakshiq-autoposter/data/theme_usage.jsonl      /tmp/autoposter-snap/theme_usage.jsonl           || true
          [ -f nakshiq-autoposter/data/posted_today.jsonl ]     && cp nakshiq-autoposter/data/posted_today.jsonl     /tmp/autoposter-snap/posted_today.jsonl          || true

          # 2. Ensure autoposter-state branch exists on origin (bootstrap on first run)
          if ! git ls-remote --exit-code --heads origin autoposter-state >/dev/null 2>&1; then
            echo "Bootstrapping autoposter-state branch from main..."
            git push origin HEAD:refs/heads/autoposter-state
          fi

          # 3. Fetch + add a worktree for the side branch
          git fetch origin autoposter-state --depth=1
          rm -rf /tmp/autoposter-state-worktree
          git worktree add /tmp/autoposter-state-worktree autoposter-state

          # 4. Drop the snapshot into the worktree
          mkdir -p /tmp/autoposter-state-worktree/nakshiq-autoposter/data
          cp /tmp/autoposter-snap/state.json            /tmp/autoposter-state-worktree/nakshiq-autoposter/state.json                 2>/dev/null || true
          cp /tmp/autoposter-snap/autoposter.log        /tmp/autoposter-state-worktree/nakshiq-autoposter/autoposter.log             2>/dev/null || true
          cp /tmp/autoposter-snap/analytics.json        /tmp/autoposter-state-worktree/nakshiq-autoposter/analytics.json             2>/dev/null || true
          cp /tmp/autoposter-snap/post_engagement.json  /tmp/autoposter-state-worktree/nakshiq-autoposter/data/post_engagement.json  2>/dev/null || true
          cp /tmp/autoposter-snap/post_outcomes.jsonl   /tmp/autoposter-state-worktree/nakshiq-autoposter/data/post_outcomes.jsonl   2>/dev/null || true
          # Phase C 2026-05-26: posted_today.jsonl is append-only like
          # post_log.jsonl; copy it last-write-wins here since merge_jsonl.py
          # below will dedupe (account_id+date keys).
          cp /tmp/autoposter-snap/posted_today.jsonl    /tmp/autoposter-state-worktree/nakshiq-autoposter/data/posted_today.jsonl    2>/dev/null || true

          # 4b. MERGE JSONL files (don't overwrite — preserve concurrent-run
          #     entries already on the remote). Worktree contents come from
          #     latest autoposter-state HEAD; snap contents are from this run.
          #     Dedupe by (post_id, platform, timestamp) for post_log and
          #     (dimension, item_id, ts[:10]) for theme_usage. Result is
          #     written back to the worktree path so the commit picks up the
          #     union of both. See nakshiq-autoposter/scripts/merge_jsonl.py.
          python3 nakshiq-autoposter/scripts/merge_jsonl.py \
                  /tmp/autoposter-state-worktree/nakshiq-autoposter/data \
                  /tmp/autoposter-snap

          # 5. Commit + push from the worktree
          # Iterate so a missing file (e.g. post_engagement.json before the
          # engagement-pull cron has ever fired) doesn't fail the whole step
          # with "fatal: pathspec did not match any files". This caused 10
          # consecutive failures on 2026-05-10 and GHA silently stopped
          # scheduling new runs.
          pushd /tmp/autoposter-state-worktree
          for f in nakshiq-autoposter/state.json \
                   nakshiq-autoposter/autoposter.log \
                   nakshiq-autoposter/analytics.json \
                   nakshiq-autoposter/data/post_engagement.json \
                   nakshiq-autoposter/data/post_outcomes.jsonl \
                   nakshiq-autoposter/data/post_log.jsonl \
                   nakshiq-autoposter/data/posted_today.jsonl \
                   nakshiq-autoposter/data/theme_usage.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: autoposter state $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Phase C 2026-05-26: track push success so we can hard-fail the
            # workflow when all 3 attempts fail. The legacy form fell through
            # silently → next run synced stale state → repeat-publish risk.
            push_ok=false
            for attempt in 1 2 3; do
              if git push origin autoposter-state; then
                echo "Push succeeded (attempt $attempt)"
                push_ok=true
                break
              fi
              echo "Push failed (attempt $attempt). Hard-resetting to remote + re-merging JSONLs..."
              # Don't try `git pull --rebase` — it almost always conflicts on
              # JSONL append-at-EOF. Instead: discard our commit, hard-reset
              # to remote (so worktree has remote's latest JSONLs), re-merge
              # our snapshot on top, then re-commit. Idempotent — every retry
              # converges on the same union of remote + snapshot entries.
              git fetch origin autoposter-state
              git reset --hard origin/autoposter-state
              # Re-copy the non-JSONL snap files (last-write-wins is fine for
              # state.json since the racing fields now live in JSONL).
              cp /tmp/autoposter-snap/state.json            nakshiq-autoposter/state.json                 2>/dev/null || true
              cp /tmp/autoposter-snap/autoposter.log        nakshiq-autoposter/autoposter.log             2>/dev/null || true
              cp /tmp/autoposter-snap/analytics.json        nakshiq-autoposter/analytics.json             2>/dev/null || true
              cp /tmp/autoposter-snap/post_engagement.json  nakshiq-autoposter/data/post_engagement.json  2>/dev/null || true
              cp /tmp/autoposter-snap/post_outcomes.jsonl   nakshiq-autoposter/data/post_outcomes.jsonl   2>/dev/null || true
              # Merge JSONLs: remote (post-reset) + our snapshot → union.
              popd > /dev/null
              python3 nakshiq-autoposter/scripts/merge_jsonl.py \
                      /tmp/autoposter-state-worktree/nakshiq-autoposter/data \
                      /tmp/autoposter-snap
              pushd /tmp/autoposter-state-worktree > /dev/null
              for f in nakshiq-autoposter/state.json \
                       nakshiq-autoposter/autoposter.log \
                       nakshiq-autoposter/analytics.json \
                       nakshiq-autoposter/data/post_engagement.json \
                       nakshiq-autoposter/data/post_outcomes.jsonl \
                       nakshiq-autoposter/data/post_log.jsonl \
                       nakshiq-autoposter/data/posted_today.jsonl \
                       nakshiq-autoposter/data/theme_usage.jsonl; do
                [ -f "$f" ] && git add "$f"
              done
              if ! git diff --staged --quiet; then
                git commit -m "chore: autoposter state $(date -u +'%Y-%m-%d %H:%M UTC') (re-merge attempt $attempt)"
              fi
              sleep $((attempt * 2))
            done
            if [ "$push_ok" != "true" ]; then
              echo "::error::Failed to push state to autoposter-state after 3 attempts. State is now divergent from origin — next run will see stale dedup data. Fail the workflow so this surfaces in the watchdog."
              exit 1
            fi
          fi
          popd

          # 6. Cleanup
          git worktree remove --force /tmp/autoposter-state-worktree || true
